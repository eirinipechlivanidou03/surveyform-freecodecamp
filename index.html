<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>
  <body>
    <!-- 1. ΤΙΤΛΟΣ ΚΑΙ ΠΕΡΙΓΡΑΦΗ -->
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>

    <!-- 2. ΦΟΡΜΑ (form element) -->
    <form id="survey-form">

      <!-- ΠΕΔΙΟ ΚΕΙΜΕΝΟΥ (TEXT INPUT) -->
      <!-- Το label συνδέεται με το for="name" προς το id="name" του input -->
      <div>
        <label for="name" id="name-label">Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Enter your name" 
          required 
        />
      </div>

      <!-- ΠΕΔΙΟ EMAIL (HTML5 validation για έγκυρο format email) -->
      <div>
        <label for="email" id="email-label">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email" 
          required 
        />
      </div>

      <!-- ΠΕΔΙΟ ΑΡΙΘΜΟΥ (NUMBER INPUT με όρια min & max) -->
      <div>
        <label for="number" id="number-label">Age</label>
        <input 
          type="number" 
          id="number" 
          name="age" 
          placeholder="Age" 
          min="3" 
          max="100" 
        />
      </div>

      <!-- DROPDOWN MENU (SELECT ELEMENT) -->
      <div>
        <label for="dropdown">Which option best describes your current role?</label>
        <select id="dropdown" name="role">
          <option value="student">Student</option>
          <option value="full-time">Full time</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- RADIO BUTTONS (Μονή επιλογή) -->
      <!-- Όλα έχουν το ΙΔΙΟ name="recommend" και ΔΙΑΦΟΡΕΤΙΚΟ value -->
      <div>
        <p>Would you recommend freeCodeCamp to a friend?</p>
        <label>
          <input type="radio" name="recommend" value="definitely" checked /> Definitely
        </label>
        <label>
          <input type="radio" name="recommend" value="maybe" /> Maybe
        </label>
        <label>
          <input type="radio" name="recommend" value="not-sure" /> Not sure
        </label>
      </div>

      <!-- CHECKBOXES (Πολλαπλή επιλογή) -->
      <!-- Κάθε checkbox έχει δικό του ξεχωριστό value -->
      <div>
        <p>What would you like to see improved? (Check all that apply)</p>
        <label>
          <input type="checkbox" name="improve" value="front-end" /> Front-End Projects
        </label>
        <label>
          <input type="checkbox" name="improve" value="back-end" /> Back-End Projects
        </label>
        <label>
          <input type="checkbox" name="improve" value="data-visualization" /> Data Visualization
        </label>
      </div>

      <!-- ΠΕΔΙΟ ΜΕΓΑΛΟΥ ΚΕΙΜΕΝΟΥ (TEXTAREA) -->
      <div>
        <p>Any comments or suggestions?</p>
        <textarea 
          id="suggestion" 
          name="comments" 
          placeholder="Enter your comment here..."
          rows="4"
          cols="40"
        ></textarea>
      </div>

      <!-- ΚΟΥΜΠΙ ΥΠΟΒΟΛΗΣ (SUBMIT BUTTON) -->
      <div>
        <button type="submit" id="submit">Submit</button>
      </div>

    </form>
  </body>
</html>
